name: Vedoy Shield Core v0.3.0 - Rust CI
on:
  push:
    paths:
      - "rust/vedoy-shield-core/**"
      - ".github/workflows/vedoy-shield-core.yml"
  pull_request:
    paths:
      - "rust/vedoy-shield-core/**"
      - ".github/workflows/vedoy-shield-core.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Rust crypto research checks (NOT a security audit)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust/vedoy-shield-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/vedoy-shield-core
      # Formatting is checked, never silently changed in CI.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Validate dependency graph and generate temporary lockfile
        run: cargo metadata --format-version 1 --no-deps > /dev/null
      - name: Static Rust checks
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and integration tests (no SPQR: fail closed)
        run: cargo test --all-targets
      - name: Optional Signal SPQR (AGPL-3.0-only; evaluation, not redistribution)
        run: cargo test --all-targets --features signal-spqr
      - name: Dependency vulnerability scan
        run: |
          cargo install cargo-audit --locked
          cargo audit
