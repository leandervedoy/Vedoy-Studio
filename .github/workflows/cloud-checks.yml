name: Vedoy Cloud checks
on:
  pull_request:
    paths:
      - 'app/api/cloud/**'
      - 'app/(marketing)/prosjekter/**'
      - 'app/(marketing)/projects/**'
      - 'app/auth/callback/**'
      - 'app/vedoy-cloud.css'
      - 'components/cloud/**'
      - 'lib/vedoy-cloud.ts'
      - 'supabase/migrations/*vedoy_cloud*'
      - 'tests/cloud-tenant-isolation.test.mjs'
      - 'scripts/vedoy-cloud-existing-db-hardening.sql'
  push:
    branches: [main]
    paths:
      - 'app/api/cloud/**'
      - 'app/(marketing)/prosjekter/**'
      - 'components/cloud/**'
      - 'lib/vedoy-cloud.ts'
      - 'tests/cloud-tenant-isolation.test.mjs'
      - 'supabase/migrations/*vedoy_cloud*'
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Cloud tenant isolation regression (offline)
        run: node --test tests/cloud-tenant-isolation.test.mjs
