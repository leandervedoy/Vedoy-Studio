name: Shield and Baseline review checks

on:
  pull_request:
    paths:
      - "scripts/shield-*.mjs"
      - "tests/shield-*.test.mjs"
      - "tests/baseline-build-target.test.mjs"
      - "package.json"
      - ".github/workflows/shield-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Shield and Baseline tests without secrets
        run: |
          node --test tests/shield-vercel-export.test.mjs tests/shield-backup.test.mjs tests/baseline-build-target.test.mjs
