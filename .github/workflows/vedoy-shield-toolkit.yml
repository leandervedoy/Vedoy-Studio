name: Vedoy Shield dependency toolkit
on:
  push:
    branches: [main]
    paths:
      - 'tools/vedoy-shield/**'
      - 'docs/vedoy-shield-library-catalog.md'
      - '.github/workflows/vedoy-shield-toolkit.yml'
  pull_request:
    paths:
      - 'tools/vedoy-shield/**'
      - 'docs/vedoy-shield-library-catalog.md'
      - '.github/workflows/vedoy-shield-toolkit.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tools/vedoy-shield/test/*.test.mjs
      - run: node tools/vedoy-shield/cli.mjs list
