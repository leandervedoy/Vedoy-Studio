name: Vedoy Shield web checks

on:
  pull_request:
    paths:
      - 'next.config.ts'
      - 'lib/vedoy-shield-headers.mjs'
      - 'lib/vedoy-shield-headers.d.mts'
      - 'tests/vedoy-shield-headers.test.mjs'
  push:
    branches: [main]
    paths:
      - 'next.config.ts'
      - 'lib/vedoy-shield-headers.mjs'
      - 'lib/vedoy-shield-headers.d.mts'
      - 'tests/vedoy-shield-headers.test.mjs'

permissions:
  contents: read

jobs:
  security-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify Vedoy Shield headers and route coverage
        run: node --test tests/vedoy-shield-headers.test.mjs
