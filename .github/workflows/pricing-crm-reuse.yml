name: Verify pricing CRM reuse
on:
  pull_request:
    paths:
      - "app/api/pricing/leads/route.ts"
      - "lib/pricing-bridge.mjs"
      - "lib/pricing-bridge.d.mts"
      - "tests/pricing-bridge.test.mjs"
      - ".github/workflows/pricing-crm-reuse.yml"
  push:
    branches: [feature/reuse-vedoy-studio-crm-pricing]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node --test tests/pricing-bridge.test.mjs
